# Render blueprint. In the Render dashboard: New > Blueprint, point it at this
# repo, and it creates the API service from this file.
#
# This builds the Dockerfile at the repo root, which is also what a service
# created by hand in the dashboard does by default - so both routes agree.
#
# DATABASE_URL and CORS_ORIGINS are marked `sync: false`, so Render asks for them
# during setup instead of storing secrets in the repo.
services:
  - type: web
    name: habit-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
